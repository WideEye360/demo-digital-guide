<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111214">

  <title>Дигитален гид за гости</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #111214;
      color: #fff;
    }

    /* =========================
       WELCOME SCREEN
    ========================= */

    .welcome {
      position: fixed;
      inset: 0;
      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
      padding: 28px;

      background:
        radial-gradient(
          circle at 50% 25%,
          rgba(255, 255, 255, 0.12),
          transparent 34%
        ),
        linear-gradient(
          145deg,
          #111214 0%,
          #20252a 48%,
          #111214 100%
        );
    }

    .welcome::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          120deg,
          transparent 35%,
          rgba(255, 255, 255, 0.035) 50%,
          transparent 65%
        );

      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;

      width: min(720px, 100%);

      animation: appear 0.9s ease both;
    }

    /* =========================
       BRAND
    ========================= */

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      margin-bottom: 28px;
      padding: 9px 16px;

      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;

      background: rgba(255, 255, 255, 0.06);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      font-size: 13px;
      letter-spacing: 2.2px;
      text-transform: uppercase;

      color: rgba(255, 255, 255, 0.82);
    }

    .brand-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;
      background: #fff;
    }

    /* =========================
       HEADLINE
    ========================= */

    h1 {
      font-size: clamp(43px, 8vw, 78px);

      line-height: 0.98;

      letter-spacing: -2.5px;

      font-weight: 750;

      margin-bottom: 24px;
    }

    .lead {
      max-width: 610px;

      margin: 0 auto 38px;

      font-size: clamp(18px, 3.5vw, 24px);

      line-height: 1.45;

      color: rgba(255, 255, 255, 0.78);
    }

    /* =========================
       BUTTON
    ========================= */

    .button {
      appearance: none;

      border: 1px solid rgba(255, 255, 255, 0.65);

      border-radius: 999px;

      padding: 17px 29px;

      min-width: 255px;

      color: #111214;

      background: #fff;

      font-size: 17px;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.28);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 20px 55px rgba(0, 0, 0, 0.38);
    }

    .button:active {
      transform: scale(0.98);
    }

    .hint {
      margin-top: 20px;

      font-size: 13px;

      color: rgba(255, 255, 255, 0.48);
    }

    /* =========================
       VIDEO
    ========================= */

    .video-screen {
      position: fixed;
      inset: 0;

      z-index: 20;

      display: none;

      align-items: center;
      justify-content: center;

      background: #000;
    }

    .video-screen.active {
      display: flex;
    }

    video {
      width: 100%;
      height: 100%;

      object-fit: contain;

      background: #000;
    }

    /* =========================
       CLOSE BUTTON
    ========================= */

    .close {
      position: absolute;

      top: 18px;
      right: 18px;

      z-index: 30;

      width: 46px;
      height: 46px;

      border-radius: 50%;

      border: 1px solid rgba(255, 255, 255, 0.35);

      color: #fff;

      background: rgba(0, 0, 0, 0.45);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      font-size: 27px;
      line-height: 1;

      cursor: pointer;
    }

    /* =========================
       ANIMATION
    ========================= */

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .welcome {
        padding: 22px;
      }

      h1 {
        letter-spacing: -1.7px;
      }

      .button {
        width: min(100%, 330px);
      }
    }
  </style>
</head>

<body>


  <!-- =========================
       WELCOME SCREEN
  ========================= -->

  <main class="welcome" id="welcome">

    <div class="content">

      <div class="brand">
        <span class="brand-dot"></span>

        Дигитален гид за гости
      </div>


      <h1>
        Бъди първи
      </h1>


      <p class="lead">
       Отличете се и превърнете престоя на вашите гости
        в по-добро преживяване. 
      </p>


      <button
        class="button"
        onclick="openDemo()"
      >
        ▶&nbsp; Вижте демо
      </button>


      <div class="hint">
        QR код · Директен достъп · Без инсталиране
      </div>

    </div>

  </main>



  <!-- =========================
       VIDEO SCREEN
  ========================= -->

  <section
    class="video-screen"
    id="videoScreen"
  >

    <button
      class="close"
      onclick="closeDemo()"
      aria-label="Затвори"
    >
      ×
    </button>


    <video
      id="promoVideo"
      controls
      playsinline
    >

      <source
        src="promo.mp4"
        type="video/mp4"
      >

      Вашият браузър не поддържа видео.

    </video>

  </section>



  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    const welcome =
      document.getElementById("welcome");

    const videoScreen =
      document.getElementById("videoScreen");

    const video =
      document.getElementById("promoVideo");


    function openDemo() {

      welcome.style.display = "none";

      videoScreen.classList.add("active");

      video.play().catch(() => {});

    }


    function closeDemo() {

      video.pause();

      video.currentTime = 0;

      videoScreen.classList.remove("active");

      welcome.style.display = "flex";

    }


    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape" &&
          videoScreen.classList.contains("active")
        ) {

          closeDemo();

        }

      }
    );

  </script>

</body>
</html>
